services:
  - type: web
    name: onpoint-qr
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT server:app
    healthCheckPath: /
    envVars:
      - key: ONPOINT_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.0
